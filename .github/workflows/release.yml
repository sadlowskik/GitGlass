name: Release

# Tagged releases build signed installers and publish a Tauri updater manifest.
# Signing is STUBBED until a real Authenticode cert is supplied (see
# scripts/sign-windows.ps1 and docs/SIGNING.md). Builds succeed unsigned in the
# meantime so the whole pipeline is proven early (Milestone 1 goal).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: MSI + NSIS installers
          - platform: windows-latest
            args: ""
          # macOS: a universal .dmg (Apple Silicon + Intel) that Mac users download
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS build targets (universal binary)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing key (REQUIRED for auto-update to verify).
          # Generate with: npm run tauri signer generate
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- Windows Authenticode (STUBBED until a cert is supplied) ---
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # --- macOS signing + notarization (OPTIONAL) ---
          # Empty = unsigned .dmg (works, but Gatekeeper shows a warning; users
          # right-click → Open to run). Fill these from an Apple Developer
          # account ($99/yr) to notarize and remove the warning. See docs/SIGNING.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GitGlass ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
